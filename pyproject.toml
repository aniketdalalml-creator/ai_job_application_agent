[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-agent"
version = "0.1.0"
description = "CareerPilot — AI career agent with FastAPI, MySQL, and Groq"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "groq>=0.29.0",
  "ddgs>=9.0.0",
  "pydantic>=2.0.0",
  "pydantic[email]>=2.0.0",
  "python-dotenv>=1.0.0",
  "rich>=13.0.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlmodel>=0.0.22",
  "pymysql>=1.1.1",
  "cryptography>=43.0.0",
  "bcrypt>=4.2.0",
  "PyJWT>=2.9.0",
  "httpx>=0.27.0",
  "alembic>=1.14.0",
  "email-validator>=2.0.0",
]

[project.scripts]
job-agent = "job_agent.__main__:main"

[project.optional-dependencies]
test = [
  "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
include = ["job_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
